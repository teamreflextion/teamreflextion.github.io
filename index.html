<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reflextion</title>
    <meta name="description" content="Reflextion makes simple, private Android apps.">
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 48px 16px; line-height: 1.6; color: #111114; background: #ffffff; }
        h1 { font-size: 2.4rem; margin: 0; letter-spacing: -0.02em; }
        h1 span { color: #0F766E; }
        .lead { color: #6b6b76; margin: 4px 0 40px; }
        .label { font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: #6b6b76; margin-bottom: 8px; }
        .app { border-top: 1px solid #e8e8ec; border-bottom: 1px solid #e8e8ec; padding: 20px 0; }
        .app h2 { font-size: 1.2rem; margin: 0 0 4px; }
        .app p { margin: 0 0 12px; color: #3a3a42; }
        a { color: #0F766E; font-weight: 600; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .links a { margin-right: 20px; }
        footer { margin-top: 40px; color: #6b6b76; }
        @media (prefers-color-scheme: dark) {
            body { background: #0B0B0F; color: #f2f2f5; }
            h1 span, a { color: #2DD4BF; }
            .lead, .label, footer { color: #9a9aa5; }
            .app { border-color: #24242b; }
            .app p { color: #c9c9d1; }
        }
    </style>
</head>
<body>
    <h1>Reflextion<span>.</span></h1>
    <p class="lead">Simple, private Android apps.</p>

    <div class="label">Apps</div>
    <div class="app">
        <h2>Age Calculator</h2>
        <p>Exact age in years, months and days, birthday countdowns and the difference between two dates.</p>
        <div class="links">
            <a href="https://play.google.com/store/apps/details?id=com.reflextion.advancedagecalculator">Get it on Google Play</a>
            <a href="age_calculator/">Privacy policy</a>
        </div>
    </div>

    <footer>Contact: <a href="mailto:teamreflextion@gmail.com">teamreflextion@gmail.com</a></footer>
</body>
</html>
